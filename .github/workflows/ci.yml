name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        # Using `npm install` (not `npm ci`) deliberately: `npm ci` hard-fails
        # the whole pipeline the moment package.json and package-lock.json
        # drift even slightly, which is exactly what broke this workflow
        # (vitest was added to package.json without regenerating the lock
        # file). `npm install` reconciles the lockfile instead of refusing
        # to run, which is more resilient for this repo's workflow.
        run: npm install
      - name: Run unit tests
        run: npm test
      - name: Build
        run: npm run build
